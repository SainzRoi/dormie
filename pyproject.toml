[project]
name = "dorm-together"
version = "1.0.0"
description = "DS 187 fair dormitory chore assignment and monitoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "jinja2>=3.1.5,<4",
    "itsdangerous>=2.2,<3",
    "argon2-cffi>=23.1,<26",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
